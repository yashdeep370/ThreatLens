<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ThreatLens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;800&display=block" rel="stylesheet">
<link rel="prefetch" href="/app">
<script>
  // Old deep links (e.g. from the browser extension) pointed at /#analysis=<id>:
  // forward them to the app before anything renders.
  if (/^#analysis=/.test(location.hash)) location.replace("/app" + location.hash);
</script>
<style>
  :root{
    --u: min(calc(100vw / 1280), calc(100dvh / 760));
    --ink:#ffffff;
    --white-btn:#fdfdfd;
    --btn-ink:#050505;
    --app-bg:#0b1020;                       /* main site background: the transition lands on it */
    --e-reveal: cubic-bezier(.16, 1, .3, 1);
    --e-soft:   cubic-bezier(.25, .8, .3, 1);
    --e-warp:   cubic-bezier(.55, 0, .7, .2); /* accelerating dive into the globe, moving from the first frame */
  }
  @supports not (height: 100dvh){ :root{ --u: min(calc(100vw / 1280), calc(100vh / 760)); } }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0;padding:0;overflow:hidden;background:#000}
  body{
    font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    text-rendering:geometricPrecision;color:var(--ink);
  }

  .hero{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#000}
  @supports not (height: 100dvh){ .hero{height:100vh} }

  /* 1280:800 bleed box, always covering the viewport */
  .bg{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);
    width:max(100vw, calc(100dvh * 1.6));
    height:max(62.5vw, 100dvh);
    background-color:#000;
    transform-origin:51% 46%;               /* zoom toward the globe */
  }
  @supports not (height: 100dvh){ .bg{width:max(100vw, calc(100vh * 1.6));height:max(62.5vw, 100vh)} }
  .bg-video{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;object-position:51% 8%;
    display:block;background-color:#000;pointer-events:none;
    opacity:0;transition:opacity .9s linear;
  }
  .bg-video.is-active{opacity:1}

  /* ---------- proceed button ---------- */
  .enter{
    /* full-width flex row: centring via left:50% + translate breaks on narrow screens,
       where the shrink-to-fit box is narrower than the button */
    position:absolute;left:0;right:0;bottom:max(64px, calc(92 * var(--u)));
    display:flex;justify-content:center;z-index:2;
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;
    font-family:inherit;text-decoration:none;white-space:nowrap;border:0;cursor:pointer;
    height:max(46px, calc(44 * var(--u)));
    padding:0 max(24px, calc(24 * var(--u))) 0 max(26px, calc(26 * var(--u)));
    border-radius:999px;background:var(--white-btn);color:var(--btn-ink);
    font-size:max(15px, calc(14.5 * var(--u)));font-weight:600;letter-spacing:-.01em;
    gap:max(10px, calc(10 * var(--u)));
    box-shadow:0 0 0 1px rgba(255,255,255,.18), 0 10px 40px rgba(124,92,255,.35);
    transition:background .18s ease, transform .25s var(--e-soft), box-shadow .3s ease;
  }
  .btn:hover{background:#fff;transform:translateY(-1px);
    box-shadow:0 0 0 1px rgba(255,255,255,.3), 0 14px 54px rgba(124,92,255,.55)}
  .btn:active{transform:translateY(0) scale(.98)}
  .arw{flex:0 0 auto;display:block;width:max(14px, calc(13 * var(--u)));height:max(11.6px, calc(10.8 * var(--u)));
       transition:transform .3s var(--e-soft)}
  .btn:hover .arw{transform:translateX(3px)}
  a:focus-visible,button:focus-visible{outline:2px solid #a78bfa;outline-offset:3px}

  /* ---------- entrance (button only; the video is never animated on entry) ---------- */
  @keyframes pillIn{from{opacity:0;transform:translateY(calc(10 * var(--u))) scale(.972)}to{opacity:1;transform:none}}
  html.anim .btn{opacity:0;will-change:transform,opacity}
  html.anim.go .btn{animation:pillIn .8s var(--e-reveal) .5s both}

  /* ---------- transition into the app: dive into the globe ---------- */
  .veil{
    position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;
    background:
      radial-gradient(circle at 51% 46%, rgba(167,139,250,.55) 0%, rgba(91,63,214,.35) 18%, rgba(11,16,32,0) 46%),
      radial-gradient(circle at 51% 46%, rgba(11,16,32,0) 30%, var(--app-bg) 72%);
  }
  .flash{
    position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;background:var(--app-bg);
  }
  .hero.warp .bg{
    transform:translate(-50%,-50%) scale(2.4);
    filter:blur(6px) brightness(1.35) saturate(1.2);
    transition:transform 1.15s var(--e-warp), filter 1.15s var(--e-warp);
  }
  .hero.warp .veil{opacity:1;transition:opacity .8s ease-in .12s}
  .hero.warp .flash{opacity:1;transition:opacity .35s ease-in .85s}
  .hero.warp .enter .btn{opacity:0;transform:scale(.92);transition:opacity .3s ease, transform .3s ease}

  @media (max-width:552px){
    .enter{bottom:max(56px, 9dvh)}
  }
  @media (prefers-reduced-motion:reduce){
    html.anim .btn{opacity:1}
    *{transition:none!important;animation:none!important}
  }
</style>
<script>
  // Entrance: arm synchronously so the button never flashes before animating in.
  (function () {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var root = document.documentElement, started = false, timer, safety;
    root.classList.add("anim");
    function clean() { clearTimeout(safety); root.classList.remove("anim", "go"); }
    function start() {
      if (started) return;
      started = true;
      clearTimeout(timer);
      safety = setTimeout(clean, 2000);
      root.addEventListener("animationend", function onEnd(e) {
        if (e.animationName === "pillIn") { root.removeEventListener("animationend", onEnd, true); clean(); }
      }, true);
      root.classList.add("go");
    }
    function boot() {
      timer = setTimeout(start, 900);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(start, start); else start();
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
  })();
</script>
</head>
<body>
<main class="hero" id="hero">
  <div class="bg" role="img" aria-label="Stylised globe of Earth rendered as a purple dot matrix against a starfield, slowly rotating">
    <video class="bg-video is-active" id="bgVideoA" autoplay muted loop playsinline preload="auto" disablepictureinpicture aria-hidden="true"
           poster="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/82e7eb75-c65f-490a-99b5-f3d1cad54200.webp">
      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260912_104036_bd6924f6-3c8e-417e-8465-6d03c8c2e9e6.mp4" type="video/mp4">
    </video>
    <video class="bg-video" id="bgVideoB" muted loop playsinline preload="auto" disablepictureinpicture aria-hidden="true"
           poster="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/82e7eb75-c65f-490a-99b5-f3d1cad54200.webp">
      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260912_104036_bd6924f6-3c8e-417e-8465-6d03c8c2e9e6.mp4" type="video/mp4">
    </video>
  </div>

  <div class="enter">
    <a class="btn" id="enterBtn" href="/app">
      Enter ThreatLens
      <svg class="arw" viewBox="0 0 12 10" fill="none" aria-hidden="true">
        <path d="M0.8 5h10M7.1 1.4 10.9 5l-3.8 3.6" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </div>

  <div class="veil" aria-hidden="true"></div>
  <div class="flash" aria-hidden="true"></div>
</main>

<script>
  // Transition: dive into the globe, then open the app (which fades in on arrival).
  (function () {
    var hero = document.getElementById("hero"), btn = document.getElementById("enterBtn");
    var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    var going = false;
    btn.addEventListener("click", function (e) {
      if (reduced || e.ctrlKey || e.metaKey || e.shiftKey || e.button === 1) return; // plain navigation
      e.preventDefault();
      if (going) return;
      going = true;
      try { sessionStorage.setItem("tl-enter", "1"); } catch (err) {}
      hero.classList.add("warp");
      setTimeout(function () { location.href = btn.href; }, 1200);
    });
    // Coming back with the Back button restores this page from cache mid-transition: reset it.
    addEventListener("pageshow", function (e) {
      if (e.persisted) { hero.classList.remove("warp"); going = false; }
    });
  })();
</script>

<script>
  // Background video: two copies cross-fade at the loop point to hide the seam.
  (function () {
    var A = document.getElementById("bgVideoA"), B = document.getElementById("bgVideoB");
    if (!A || !B) return;
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
      A.removeAttribute("autoplay"); A.pause(); B.pause();
      try { A.currentTime = 0; } catch (e) {}
      return;
    }
    var FADE = 0.9, cur = A, nxt = B, swapping = false;
    function play(v) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
    play(A);
    function tick() {
      if (swapping || !cur.duration) return;
      if (cur.duration - cur.currentTime > FADE) return;
      swapping = true;
      var out = cur;
      nxt.currentTime = 0; play(nxt);
      nxt.classList.add("is-active"); out.classList.remove("is-active");
      cur = nxt; nxt = out;
      setTimeout(function () { out.pause(); out.currentTime = 0; swapping = false; }, FADE * 1000 + 100);
    }
    A.addEventListener("timeupdate", tick);
    B.addEventListener("timeupdate", tick);
  })();
</script>
</body>
</html>
